name: CI/CD Pipeline Docker Build

on:
  push:
    branches:
      - main  # Trigger this pipeline on pushes to the main branch.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Docker Build
        run: |
          echo "Starting Docker build..."
          sleep 2
          echo "Error: Docker build failed due to missing dependencies!"
          exit 1  # Simulating Docker build failure

      - name: Run Tests
        run: |
          echo "Running tests..."
          sleep 2
          echo "Error: Test failure detected in unit tests!"
          exit 1  # Simulating test failure

      - name: Push Docker Image
        run: |
          echo "Pushing Docker image to DockerHub..."
          sleep 2
          echo "Error: Docker push failed due to authentication issue!"
          exit 1  # Simulating push failure

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to Kubernetes..."
          sleep 2
          echo "Error: Deployment failed due to invalid Kubernetes configuration!"
          exit 1  # Simulating deployment failure

      - name: Switch Traffic to Green
        run: |
          echo "Switching traffic to green environment..."
          sleep 2
          echo "Error: Traffic switch failed due to missing Kubernetes service selector!"
          exit 1  # Simulating traffic switch failure
